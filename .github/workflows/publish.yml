name: Publish site

# Builds the catalog (catalog.json, packages with SHA-256s, previews) and the static site,
# then deploys it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BASE_URL: https://pcwerk-jh.github.io/hopea-public

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build -c release
      - name: Build catalog and site
        run: .build/release/hopea-look build-catalog --looks looks --reference reference --site site --out _site --base-url "$BASE_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
